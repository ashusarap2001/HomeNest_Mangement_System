<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Management - Hostel Management</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/CSS/studManagemnt.css">

</head>
<body>
	<input type="hidden" id="status" th:value="${status}" />
	<!-- Sidebar -->
	<div class="sidebar position-fixed p-3">
		<h3>"HomeNest"</h3>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminDashboard}"> <i
					class="fas fa-tachometer-alt"></i> Dashboard
			</a></li>
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/admin/adminStudManagement}"> <i class="fas fa-users"></i>
					Candidate Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminRoomManagement}"> <i class="fas fa-bed"></i>
					Room Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminFeeManagement}"> <i
					class="fas fa-credit-card"></i> Fees Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminReportManagement}"> <i
					class="fas fa-chart-line"></i> Hostel Reports
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/AdminSettingPage}"> <i class="fas fa-cogs"></i>
					Settings
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/lateNightApproval}"> <i class="fas fa-cogs"></i>
					Leave-Night Out Approval
			</a></li>
		</ul>
	</div>
	<!-- Main Content -->
	<div class="content fadeIn">
		<!-- Header Section -->
		<div class="container mb-4">
			<h1>Student Management</h1>
			<p class="lead">Manage Hostel Students, Admissions, and Records</p>
		</div>

		<!-- Add Student Section in Container -->
		<div class="container mb-4">
			<div class="row">
				<div class="col-md-6">
					<div class="card">
						<div class="card-header">
							<h5>Update Candidate</h5>
						</div>
						<div class="card-body">
							<form th:action="@{/admin/saveUpdateCandidate}" method="post" th:object="${editData}">

								<div class="mb-3">
									<input type="hidden" name="id"
										class="form-control" id="age" th:value="${editData.id}">
								</div>
									<div class="mb-3">
									<input type="hidden" name="uniqueid"
										class="form-control" id="age" th:value="${editData.uniqueid}">
								</div>
								<!-- Name -->
								<div class="mb-3">
									<i class="fa-solid fa-user"></i> <label for="name"
										class="form-label">Name</label> <input type="text" name="name"
										class="form-control" id="name"
										placeholder="Enter your full name"  th:value="${editData.name}">
								</div>
								<!-- Age -->
								<div class="mb-3">
									<i class="fa-solid fa-caret-up"></i> <label for="age"
										class="form-label">Age</label> <input type="number" name="age"
										class="form-control" id="age" placeholder="Enter your age"  th:value="${editData.age}">
								</div>
								<!-- DOB -->
								<div class="mb-3">
									<i class="fa-solid fa-cake-candles"></i> <label for="dob"
										class="form-label">Date of Birth</label>
										 <input type="date" name="dob" class="form-control" id="dob"  th:value="${editData.dob}">
								</div>
								<!-- Address -->
								<div class="mb-3">
									<i class="fa-solid fa-address-book"></i> <label for="address"
										class="form-label">Address</label>
									<input type="text" class="form-control" name="address" id="address"  th:value="${editData.address}"
										placeholder="Enter your address">
										
								</div>
								<!-- Contact -->
								<div class="mb-3">
									<i class="fa-solid fa-phone"></i> <label for="contact"
										class="form-label">Contact Number</label> <input type="tel"
										name="contact" class="form-control" id="contact" th:value="${editData.contact}"
										placeholder="Enter your contact number">
								</div>
								<!-- Email -->
								<div class="mb-3">
									<i class="fa-solid fa-envelope"></i> <label for="email"
										class="form-label">Email</label> <input type="email"
										name="email" class="form-control" id="email" th:value="${editData.email}"
										placeholder="Enter your email">
								</div>

							<!-- Password -->
								<div class="mb-3">
									<i class="fa-solid fa-lock"></i> <label for="password"
										class="form-label">Password</label> <input type="text"
										name="password" class="form-control" id="password" th:value="${editData.password}"
										placeholder="Enter your password">
								</div>
								<!-- Submit Button -->
								<div class="d-grid">
									<button type="submit" class="btnSubmit btn btn-primary mb-3">Update</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>


		<!-- Bootstrap JS and Popper.js -->
		<script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script type="text/javascript">
    var status = document.getElementById("status").value;
    
    if(status) {  // Check if status is not empty
        if (status === "Update") {
            swal("Congrats", "Update Successfull", "success");
        } else if (status === "NotUpdate") {
            swal("Oops", "There was an issue updating", "error");
        }
    }
</script>
</body>
</html>
