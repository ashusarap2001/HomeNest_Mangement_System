<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Status - Candidate</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	font-family: 'Poppins', sans-serif;
	background-color: #f7f9fc;
}

.sidebar {
	width: 270px;
	background: linear-gradient(45deg, #34495e, #2c3e50);
	color: white;
	height: 100vh;
	position: fixed;
	padding-top: 20px;
	transition: width 0.4s ease-in-out;
	overflow-x: hidden;
}

.sidebar:hover {
	width: 300px;
}

.sidebar h3 {
	text-align: center;
	font-size: 24px;
	margin-bottom: 20px;
}

.sidebar .nav-link {
	color: white;
	font-size: 18px;
	margin: 10px 0;
	padding: 10px;
	border-radius: 6px;
	transition: all 0.3s ease-in-out;
}

.sidebar .nav-link:hover {
	background-color: #1abc9c;
	transform: translateX(10px);
}

.content {
	margin-left: 290px;
	padding: 20px;
}

.fee-card {
	background: #ffffff;
	border-radius: 10px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
	margin-bottom: 20px;
	padding: 20px;
	animation: fadeInUp 1s ease-in-out;
}

.fee-card h3 {
	margin-bottom: 15px;
}

.table-section {
	background: #ffffff;
	border-radius: 10px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
	padding: 20px;
	animation: fadeInUp 1.5s ease-in-out;
}

/* Animations */
@keyframes fadeInUp {from { opacity:0;
	transform: translateY(20px);
}

to {
	opacity: 1;
	transform: translateY(0);
}
}
</style>
<link rel="stylesheet" href="/CSS/AdminNavCss.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg">
		<div class="container-fluid">
			<!-- Website Logo and Name -->
			<a class="navbar-brand" href="#"> <img src="/IMG/hostelLogo.jpeg" alt="Logo"
				width="30" height="30" class="d-inline-block align-text-top">
				"HomeNest"
			</a>
			
			
			<!-- Navbar Items -->
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse justify-content-end"
				id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="#">Home</a></li>
					<!--  <li class="nav-item">
                        <a class="nav-link" href="#"><span th:text="${Admin_Name}"></span> </a>
                    </li> -->
					<li class="nav-item"><a href="/logout">
							<button class="btn btn-logout">Logout</button>
					</a></li>
				</ul>
			</div>
		</div>
	</nav>
			
			

	<!-- Sidebar -->
	<div class="sidebar">
	
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/candidate/candidateDashboard}">Profile</a></li>

			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studRoomManagement}">Room Details</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studFeeManagement}">Fee Status</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studNightOutApprovalManagement}">Night-Out
					Requests</a></li>
			
			
		</ul>
	</div>

	<!-- Main Content -->
	<div class="content">
		<!-- Page Title -->
		<h1 class="mb-4">Fee Status</h1>

		<!-- Fee Summary Card -->
		<div class="fee-card">
			<h3>Fee Summary</h3>
			<p>
				<strong>Total Fees:</strong> ₹ <span th:text="${amount}"></span>
			</p>
			<p>
				<strong>Paid:</strong> ₹ <span th:text="${paying_amount}"></span>
			</p>
			<p>
				<strong>Pending: ₹ <span th:text="${remaning_amount}"></span>
				</strong>
			</p>
			<p>
				<strong>Lat Payment Date :</strong> <span th:text="${date}"></span>
			</p>
		</div>

	</div>

	<!-- Bootstrap JS and Popper.js -->
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
