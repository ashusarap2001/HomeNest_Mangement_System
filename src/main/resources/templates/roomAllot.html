	<!-- Main Content -->
	<div class="content fadeIn">
		<!-- Header -->
		<div class="mb-4">
			<h1>Room Management</h1>
			<p class="lead">Manage Hostel Rooms, Allocations, and
				Availability</p>
		</div>

		<!-- Room Allocation Section -->
		<div class="row mb-4">
			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						<h5>Add New Room</h5>
					</div>
					<div class="card-body">
						<form th:action="@{/admin/saveRoomAllotData}" method="post">
						<div class="mb-3">
								<label for="roomNumber" class="form-label">Candidate</label> <input
									type="number" class="form-control" id="uniqueid"
									name="uniqueid" placeholder="Enter uniqueID">
							</div>
						<div class="mb-3">
								<label for="roomNumber" class="form-label">Candidate Name</label> <input
									type="text" class="form-control" id="name"
									name="name" placeholder="Candidate Name">
							</div>
							
							<div class="mb-3">
								<label for="roomNumber" class="form-label">Room Number</label> <input
									type="text" class="form-control" id="room_no"
									name="room_no" placeholder="Enter Room Number">
							</div>
							<div class="mb-3">
								<label for="roomType" class="form-label">Room Type</label> <select
									class="form-select" id="roomType" name="room_type">
									<option selected value="Standard Room">Standard Room</option>
									<option value="Premium Room">Premium Room</option>
									<option value="VIP Suits">VIP Suits</option>
								</select>
							</div>
							
							<button type="submit" class="btn custom-btn">Allot Room </button>
						</form>
					</div>
				</div>
			</div>
		</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script type="text/javascript">
    var status = document.getElementById("status").value;
    
    if(status) {  // Check if status is not empty
        if (status === "Allot") {
            swal("Congrats", "Room Alloted SuccessFully....", "success");
        } else if (status === "NotAllot") {
            swal("Oops", "There was an issue alloting room....", "error");
        }
    }
</script>
