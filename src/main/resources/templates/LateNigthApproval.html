<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Night Approval</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/CSS/lateNigthApproval.css">
<body>

	<!-- Sidebar -->
	<div class="sidebar position-fixed p-3">
		<h3>"HomeNest"</h3>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminDashboard}"> <i
					class="fas fa-tachometer-alt"></i> Dashboard
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminStudManagement}"> <i class="fas fa-users"></i>
					Student Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/roomAllot}"> <i class="fas fa-credit-card"></i>
					Room Allotment
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminFeeManagement}"> <i
					class="fas fa-credit-card"></i> Fees Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminReportManagement}"> <i
					class="fas fa-chart-line"></i> Hostel Reports
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/AdminSettingPage}"> <i class="fas fa-cogs"></i>
					Settings
			</a></li>
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/admin/lateNightApproval}"> <i class="fas fa-cogs"></i>
					Leave-Night Out Approval
			</a></li>
		</ul>
	</div>

	<!-- Main Content -->
	<div class="content fadeIn">
		<h1 class="mb-4">Leave-Night Out Approval</h1>

		<!-- Requests Table -->
		<div class="container">
			<div class="card mb-4">
				<div class="card-header">
					<h5>Pending Night-Out Requests</h5>
				</div>
				<div class="card-body">
					<table class="table table-hover">
						<thead class="table-light">
							<tr>
								<th scope="col">UID</th>
								<th scope="col">Name</th>
								<th scope="col">Room Number</th>
								<th scope="col">Date</th>
								<th scope="col">Reason</th>
								<th scope="col">Time</th>
								<th scope="col">Status</th>
								<th scope="col">Action</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="req : ${allRequest}">
								<td th:text="${req.uID}"></td>
								<td th:text="${req.name}"></td>
								<td th:text="${req.room_no}"></td>
								<td th:text="${req.date}"></td>
								<td th:text="${req.Reason}"></td>
								<td th:text="${req.time}"></td>
								<td th:text="${req.status}"></td>
								<td><a th:href="@{/admin/acceptByID/{id}(id=${req.id})}">
										<button class="btn btn-accept btn-sm">Accept</button>
								</a> <a th:href="@{/admin/rejectByID/{id}(id=${req.id})}">
										<button class="btn btn-reject btn-sm">Reject</button>
								</a></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS and Popper.js -->
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
