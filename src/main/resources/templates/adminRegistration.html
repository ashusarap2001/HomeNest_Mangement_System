<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace=" ~{base::Layout(~{::section})}" >

<head>
     <title>Student Registration</title>
</head>

<body>
<section>
   <div class="container mt-5 border rounded-3 columnBG">
        <h1 class="d-flex justify-content-center">Admin Registration</h1>
        <div class="row">
          <!-- Image Section -->
          <div class="col-md-5 d-flex align-items-center justify-content-center image-container">
            <img src="Image/registrationImage.jpg" alt="Hostel Image" class="img-fluid">
          </div>
          <!-- Registration Form -->
          <div class="col-md-7 ">
            <form th:action="@{/saveAdminData}" method="post">
            <!-- Name -->
              <div class="mb-3">
                <i class="fa-solid fa-user"></i>
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter your full name" >
              </div>
              <!-- Age -->
              <div class="mb-3">
                <i class="fa-solid fa-caret-up"></i>
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" name="age" placeholder="Enter your age">
              </div>
              <!-- DOB -->
              <div class="mb-3">
                <i class="fa-solid fa-cake-candles"></i>
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" name="dob">
              </div>
              <!-- Address -->
              <div class="mb-3">
                <i class="fa-solid fa-address-book"></i>
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" name="address" rows="2" placeholder="Enter your address" style="max-width: 300px; border-radius: 20px;"></textarea>
              </div>
              <!-- Contact -->
              <div class="mb-3">
                <i class="fa-solid fa-phone"></i>
                <label for="contact" class="form-label">Contact Number</label>
                <input type="tel" class="form-control" name="number" placeholder="Enter your contact number">
              </div>
              <!-- Email -->
              <div class="mb-3">
                <i class="fa-solid fa-envelope"></i>
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" placeholder="Enter your email">
              </div>
              <!-- Password -->
              <div class="mb-3">
                <i class="fa-solid fa-lock"></i>
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="pass" placeholder="Enter your password">
              </div>
              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btnSubmit btn btn-outline-success mb-3">Register</button>
              </div>
            </form>
          </div>
        </div>
      </div>

</section>
  </body>
  </html>
