<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel Report - Hostel Management</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/CSS/hotelRepotManagement.css">
<body>

	<!-- Sidebar -->
	<div class="sidebar position-fixed p-3">
		<h3>"HomeNest"</h3>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminDashboard}"> <i
					class="fas fa-tachometer-alt"></i> Dashboard
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminStudManagement}"> <i class="fas fa-users"></i>
					Student Management
			</a></li>
				<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/roomAllot}"> <i
					class="fas fa-credit-card"></i> Room Allotment
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminFeeManagement}"> <i
					class="fas fa-credit-card"></i> Fees Management
			</a></li>
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/admin/adminReportManagement}"> <i
					class="fas fa-chart-line"></i> Hostel Reports
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/AdminSettingPage}"> <i class="fas fa-cogs"></i>
					Settings
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/lateNightApproval}"> <i class="fas fa-cogs"></i>
					Leave-Night Out Approval
			</a></li>
		</ul>
	</div>
	<!-- Main Content -->
	<div class="content fadeIn">
		<!-- Header Section -->
		<div class="container mb-4">
			<h1>Hostel Reports</h1>
			<p class="lead">View, download, and generate reports related to
				the hostel operations.</p>
		</div>

		<!-- Hostel Summary Report Section -->
		<div class="container mb-4">
			<div class="row">
				<div class="col-md-4">
					<div class="card">
						<div class="card-header">
							<h5>Total Students</h5>
						</div>
						<div class="card-body">
							<h3>
								<span th:text="${count}"></span>
							</h3>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card">
						<div class="card-header">
							<h5>Total Rooms</h5>
						</div>
						<div class="card-body">
							<h3>
								<span th:text="${roomCount}"></span>
							</h3>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card">
						<div class="card-header">
							<h5>Total Fees Collected</h5>
						</div>
						<div class="card-body">
							<h3>₹
								<span th:text="${RecivedAmount}"></span>
							</h3>
						</div>
					</div>
				</div>
			</div>
		</div>


		<!-- Bootstrap JS and Popper.js -->
		<script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
