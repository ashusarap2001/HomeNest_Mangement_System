<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEE Management - Hostel Management</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/CSS/feeManagemnt.css">
<body>
	<input type="hidden" id="status" th:value="${status}" />
	<!-- Sidebar -->
	<div class="sidebar position-fixed p-3">
		<h3>"HomeNest"</h3>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminDashboard}"> <i
					class="fas fa-tachometer-alt"></i> Dashboard
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminStudManagement}"> <i class="fas fa-users"></i>
					Student Management
			</a></li>
				<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/roomAllot}"> <i
					class="fas fa-credit-card"></i> Room Allotment
			</a></li>
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/admin/adminFeeManagement}"> <i
					class="fas fa-credit-card"></i> Fees Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminReportManagement}"> <i
					class="fas fa-chart-line"></i> Hostel Reports
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/AdminSettingPage}"> <i class="fas fa-cogs"></i>
					Settings
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/lateNightApproval}"> <i class="fas fa-cogs"></i>
					Leave-Night Out Approval
			</a></li>
		</ul>
	</div>


	<!-- Update Fee Payment Section -->
	<div class="container">
		<div class="card">
			<div class="card-header">
				<h5>Add Fee Payment</h5>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/updatePayment}" method="post"
					th:object="${paymentData}">

					<div class="mb-3">
						<input type="hidden" class="form-control" name="id" id="id"
							th:value="${paymentData.id}">
					</div>

					<div class="mb-3">
						<label for="studentName" class="form-label">Candidate Name</label>
						<input type="text" class="form-control" name="candidate_name"
							id="studentName" placeholder="Enter Student Name"
							th:value="${paymentData.candidate_name}">
					</div>
					<div class="mb-3">
						<label for="paymentAmount" class="form-label">Amount</label> <input
							type="number" class="form-control" name="amound"
							id="paymentAmount" placeholder="Enter Amount"
							th:value="${paymentData.amound}">
					</div>

					<div class="mb-3">
						<h3>Remaining ₹<span th:text="${RemaningAmount}"></span></h3>
					</div>


					<div class="mb-3">
						<label for="paymentAmount" class="form-label">Paying
							Amount</label> <input type="number" class="form-control"
							name="paying_amount" id="paying_amount"
							placeholder="Enter Amount">
					</div>

					<div class="mb-3">
						<label for="paymentDate" class="form-label">Payment Date</label> <input
							type="date" class="form-control" name="date" id="paymentDate"
							th:value="${paymentData.date}">
					</div>

					<div class="mb-3">
						<label for="paymentStatus" class="form-label">Payment
							Status</label> <select class="form-select" id="paymentStatus"
							name="status" th:value="${paymentData.status}">
							<option value="paid">Paid</option>
							<option value="pending">Pending</option>
						</select>
					</div>

					<button type="submit" class="btn custom-btn">Update
						Payment</button>
				</form>
			</div>
		</div>
	</div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script type="text/javascript">
    var status = document.getElementById("status").value;
    
    if(status) {  // Check if status is not empty
        if (status === "UFee") {
            swal("Congrats", "Payment Succesfully....", "success");
        } else if (status === "UNotFee") {
            swal("Oops", "There was an issue....", "error");
        }
    }
</script>

</body>
</html>
