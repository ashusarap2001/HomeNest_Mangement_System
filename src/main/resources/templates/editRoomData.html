<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Management - Hostel Management</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/CSS/roomManagemnt.css">

</head>
<body>
	<!-- Sidebar -->
	<div class="sidebar position-fixed p-3">
		<h3>"HomeNest"</h3>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminDashboard}"> <i
					class="fas fa-tachometer-alt"></i> Dashboard
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminStudManagement}"> <i class="fas fa-users"></i>
					Student Management
			</a></li>
				<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/roomAllot}"> <i
					class="fas fa-credit-card"></i> Room Allotment
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminFeeManagement}"> <i
					class="fas fa-credit-card"></i> Fees Management
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/adminReportManagement}"> <i
					class="fas fa-chart-line"></i> Hostel Reports
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/AdminSettingPage}"> <i class="fas fa-cogs"></i>
					Settings
			</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/admin/lateNightApproval}"> <i class="fas fa-cogs"></i>
					Leave-Night Out Approval
			</a></li>
		</ul>
	</div>
	<!-- Main Content -->
	<div class="content fadeIn">
		<!-- Header -->
		<div class="mb-4">
			<h1>Room Management</h1>
			<p class="lead">Manage Hostel Rooms, Allocations, and
				Availability</p>
		</div>

		<!-- Room Allocation Section -->
		<div class="row mb-4">
			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						<h5>Add New Room</h5>
					</div>
					<div class="card-body">
						<form th:action="@{/admin/saveEditRoom}" method="post" th:object="${roomData}">
							
							<div class="mb-3">
								 <input type="hidden" class="form-control" 
									name="id" placeholder="Enter Room Number" th:value="${roomData.id}">
							</div>
							
							<div class="mb-3">
								<label for="roomNumber" class="form-label">Room Number</label>
								 <input type="text" class="form-control" id="roomNumber"
									name="roomNumber" placeholder="Enter Room Number" th:value="${roomData.roomNumber}">
							</div>
							<div class="mb-3">
								<label for="roomType" class="form-label">Room Type</label> <select
									class="form-select" id="roomType" name="roomType"  th:value="${roomData.roomType}">
									<option selected value="Standard Room">Standard Room</option>
									<option value="Premium Room">Premium Room</option>
									<option value="VIP Suits">VIP Suits</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="roomStatus" class="form-label">Room Status</label> <select
									class="form-select" id="roomStatus" name="roomStatus"  th:value="${roomStatus}">
									<option selected>Choose Status</option>
									<option value="available">Available</option>
									<option value="occupied">Occupied</option>
								</select>
							</div>
							<button type="submit" class="btn custom-btn">Add Room</button>
						</form>
					</div>
				</div>
			</div>
		</div>

	
	<!-- Bootstrap JS and Popper.js -->
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
