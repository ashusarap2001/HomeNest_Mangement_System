<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Out Request - Candidate</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	font-family: 'Poppins', sans-serif;
	background-color: #f7f9fc;
}

.sidebar {
	width: 270px;
	background: linear-gradient(45deg, #34495e, #2c3e50);
	color: white;
	height: 100vh;
	position: fixed;
	padding-top: 20px;
	transition: width 0.4s ease-in-out;
	overflow-x: hidden;
}

.sidebar:hover {
	width: 300px;
}

.sidebar h3 {
	text-align: center;
	font-size: 24px;
	margin-bottom: 20px;
}

.sidebar .nav-link {
	color: white;
	font-size: 18px;
	margin: 10px 0;
	padding: 10px;
	border-radius: 6px;
	transition: all 0.3s ease-in-out;
}

.sidebar .nav-link:hover {
	background-color: #1abc9c;
	transform: translateX(10px);
}

.content {
	margin-left: 290px;
	padding: 20px;
}

.card {
	border-radius: 10px;
	box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
}

.form-section {
	background-color: #fff;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
	margin-bottom: 30px;
	animation: fadeIn 1.5s ease-in-out;
}

.request-table {
	background-color: #fff;
	border-radius: 10px;
	padding: 20px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
	animation: fadeIn 1.5s ease-in-out;
}

/* Animations */
@keyframes fadeIn {from { opacity:0;
	
}

to {
	opacity: 1;
}
}
</style>
<link rel="stylesheet" href="/CSS/AdminNavCss.css">
</head>
<body>
	<input type="hidden" id="status" th:value="${status}" />
	<nav class="navbar navbar-expand-lg">
		<div class="container-fluid">
			<!-- Website Logo and Name -->
			<a class="navbar-brand" href="#"> <img src="/IMG/hostelLogo.jpeg" alt="Logo"
				width="30" height="30" class="d-inline-block align-text-top">
				"HomeNest"
			</a>
			
			
			<!-- Navbar Items -->
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse justify-content-end"
				id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="#">Home</a></li>
					<!--  <li class="nav-item">
                        <a class="nav-link" href="#"><span th:text="${Admin_Name}"></span> </a>
                    </li> -->
					<li class="nav-item"><a href="/logout">
							<button class="btn btn-logout">Logout</button>
					</a></li>
				</ul>
			</div>
		</div>
	</nav>


	<!-- Sidebar -->
	<div class="sidebar">
	
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link active"
				th:href="@{/candidate/candidateDashboard}">Profile</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studRoomManagement}">Room Details</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studFeeManagement}">Fee Status</a></li>
			<li class="nav-item"><a class="nav-link"
				th:href="@{/candidate/studNightOutApprovalManagement}">Night-Out
					Requests</a></li>
			
		
		</ul>
	</div>

	<!-- Main Content -->
	<div class="content">
		<!-- Page Title -->
		<h1 class="mb-4">Night-Out Requests</h1>

		<!-- Night-Out Request Form -->
		<div class="form-section">
			<h2 class="mb-3">Submit Night-Out Request</h2>
			<form th:action="@{/candidate/nightOutRequestion}" method="post">
				<div class="mb-3">

					<div class="mb-3">
						<label for="Name" class="form-label">Name</label> <input
							type="text" class="form-control" id="name" name="name" required>
					</div>
					<label for="reason" class="form-label">Reason for Night-Out</label>
					<textarea class="form-control" name="Reason" id="reason" rows="3"
						placeholder="Enter your reason"></textarea>
				</div>
				<div class="mb-3">
					<label for="date" class="form-label">Date</label> <input
						type="date" class="form-control" name="date" id="date" required>
				</div>
				<div class="mb-3">
					<label for="time" class="form-label">Time</label> <input
						type="time" class="form-control" name="Time" id="time" required>
				</div>
				<button type="submit" class="btn btn-primary">Submit
					Request</button>
			</form>
		</div>

		<!-- Previous Requests Table -->
		<div class="request-table">
			<h2 class="mb-3">Previous Night-Out Requests</h2>
			<table class="table">
				<thead class="table-dark">
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Reason</th>
						<th scope="col">Date</th>
						<th scope="col">Time</th>
						<th scope="col">Status</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="req : ${request}">
						<td th:text="${req.name}"></td>
						<td th:text="${req.Reason}"></td>
						<td th:text="${req.date}"></td>
						<td th:text="${req.Time}"></td>
						<td> <span class="badge bg-danger" th:text="${req.status}"> </span> </td>
						
					</tr>
					
				</tbody>
			</table>
		</div>
	</div>

	<!-- Bootstrap JS and Popper.js -->
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
		
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script type="text/javascript">
    var status = document.getElementById("status").value;
    
    if(status) {  // Check if status is not empty
        if (status === "NightOut") {
            swal("Congrats", "Request Send Successfully", "success");
        } else if (status === "NotNightOut") {
            swal("Oops", "There was an issue sending request....", "error");
        }
    }
</script>
</body>
</html>
